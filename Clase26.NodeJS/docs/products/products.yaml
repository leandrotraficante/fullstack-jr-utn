openapi: 3.0.0
info:
  title: API de Productos
  version: 1.0.0
  description: API para gestión de productos

paths:
  /api/products:
    get:
      summary: Obtener todos los productos
      description: Retorna una lista de todos los productos disponibles en la base de datos
      tags: [Products]
      responses:
        200:
          description: Lista de productos obtenida exitosamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
        500:
          description: Error interno del servidor
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

    post:
      summary: Crear nuevo producto
      description: Crea un nuevo producto en la base de datos
      tags: [Products]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - price
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 100
                  description: Nombre del producto
                description:
                  type: string
                  maxLength: 500
                  description: Descripción del producto
                price:
                  type: number
                  minimum: 0
                  description: Precio del producto
      responses:
        201:
          description: Producto creado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        400:
          description: Datos inválidos
        500:
          description: Error interno del servidor

  /api/products/{id}:
    get:
      summary: Obtener producto por ID
      description: Retorna un producto específico basado en su ID
      tags: [Products]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: ID único del producto
      responses:
        200:
          description: Producto encontrado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        404:
          description: Producto no encontrado
        500:
          description: Error interno del servidor

    put:
      summary: Actualizar producto
      description: Actualiza un producto existente por su ID
      tags: [Products]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: ID único del producto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 100
                description:
                  type: string
                  maxLength: 500
                price:
                  type: number
                  minimum: 0
      responses:
        200:
          description: Producto actualizado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        404:
          description: Producto no encontrado
        500:
          description: Error interno del servidor

    delete:
      summary: Eliminar producto
      description: Elimina un producto de la base de datos por su ID
      tags: [Products]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: ID único del producto
      responses:
        200:
          description: Producto eliminado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        404:
          description: Producto no encontrado
        500:
          description: Error interno del servidor

components:
  schemas:
    Product:
      type: object
      required:
        - name
        - price
      properties:
        _id:
          type: string
          description: ID único del producto
        name:
          type: string
          description: Nombre del producto
          minLength: 2
          maxLength: 100
        description:
          type: string
          description: Descripción del producto
          maxLength: 500
        price:
          type: number
          description: Precio del producto
          minimum: 0
        createdAt:
          type: string
          format: date-time
          description: Fecha de creación
        updatedAt:
          type: string
          format: date-time
          description: Fecha de última actualización


