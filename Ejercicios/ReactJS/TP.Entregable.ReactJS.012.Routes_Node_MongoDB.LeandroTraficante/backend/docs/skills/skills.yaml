paths:
  /api/skills:
    get:
      summary: Obtener todas las skills
      description: Retorna una lista de todas las skills disponibles en el sistema
      tags:
        - Skills
      responses:
        '200':
          description: Lista de skills obtenida exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Skills obtenidas exitosamente"
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        _id:
                          type: string
                          example: "60f7b3b3b3b3b3b3b3b3b3b3"
                        name:
                          type: string
                          example: "JavaScript"
                        category:
                          type: string
                          example: "Programación"
                        description:
                          type: string
                          example: "Lenguaje de programación para web"
                        createdAt:
                          type: string
                          format: date-time
                          example: "2023-07-20T10:30:00.000Z"
                        updatedAt:
                          type: string
                          format: date-time
                          example: "2023-07-20T10:30:00.000Z"
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Error interno del servidor"
                  error:
                    type: string
                    example: "Error al conectar con la base de datos"
